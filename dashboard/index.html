<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reel-Sorts Automation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <h1>Reel-Sorts</h1>
        <p>Instagram → Google Drive → YouTube automation</p>
      </div>
      <button id="logoutBtn" class="secondary hidden">Logout</button>
    </header>

    <section id="authCard" class="card">
      <h2>Dashboard Login</h2>
      <form id="authForm">
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p id="authMessage" class="message"></p>
    </section>

    <div id="app" class="hidden">
      <section class="grid">
        <div class="card">
          <h2>Add Instagram account</h2>
          <form id="accountForm">
            <input id="username" placeholder="@singh.is.rajpoot" required>
            <button type="submit">Add account</button>
          </form>
        </div>

        <div class="card">
          <h2>Add Reel URL</h2>
          <form id="reelForm">
            <input id="reelUrl" type="url"
              placeholder="https://www.instagram.com/reel/..."
              required>
            <button type="submit">Queue Reel</button>
          </form>
        </div>
      </section>

      <section class="card">
        <div class="sectionHead">
          <h2>Instagram accounts</h2>
          <button id="refreshBtn" class="secondary">Refresh</button>
        </div>
        <div id="accounts"></div>
      </section>

      <section class="card">
        <div class="sectionHead">
          <h2>Recent jobs</h2>
        </div>
        <div id="jobs"></div>
      </section>

      <p id="appMessage" class="message"></p>
    </div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
