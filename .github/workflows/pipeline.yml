name: Reel Sorts Daily Pipeline

on:
  schedule:
    # Daily 01:30 UTC = 07:00 AM IST
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp
          pip install -r automation/requirements.txt

      - name: Create Cookies File
        env:
          INSTA_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        run: |
          cat << 'EOF' > automation/cookies.txt
          ${{ secrets.INSTAGRAM_COOKIES }}
          EOF

      - name: Run Automation Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          PYTHONPATH: automation
        run: |
          python automation/main.py download
          python automation/main.py upload
          python automation/main.py cleanup
